
[cerebrium.deployment]
name = "voice-agent-backend-api"
python_version = "3.12"
docker_base_image_url = "debian:bookworm-slim"
disable_auth = true
include = ["*"]
exclude = ['.*', '__pycache__/', '*.pyc', '.env']

# Backend API runs as a web service
[cerebrium.runtime.custom]
port = 8000
entrypoint = ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
healthcheck_endpoint = "/health"
readycheck_endpoint = "/docs"

[cerebrium.hardware]
region = "us-east-1"
provider = "aws"
compute = "CPU"
cpu = 2
memory = 8.0

[cerebrium.scaling]
min_replicas = 1                           # Keep at least 1 running for the voice bot
max_replicas = 3
cooldown = 30
replica_concurrency = 10                   # Handle multiple requests
scaling_metric = "concurrency_utilization"

[cerebrium.dependencies.paths]
pip = "requirements.txt"

# database persistence
[cerebrium.volumes]
# this sets persistent SQLite database
sqlite_db = { size = "10Gi", mount_path = "/app/data" }
